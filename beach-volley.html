<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEACH VOLLEY GIRLS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap');
  :root{ --navy:#122B45; --teal:#0E7C86; --coral:#FF6B5B; --sand:#F4D58D; --sun:#FFC94A; --foam:#EAF7F5; }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background: radial-gradient(ellipse at top, #1c4a63 0%, var(--navy) 65%);
    font-family:'Nunito', sans-serif; color:var(--foam); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  h1,h2,.display{ font-family:'Baloo 2', sans-serif; }
  #wrap{ position:relative; width:400px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.45)); }
  #stage{ position:relative; width:400px; height:700px; border-radius:22px; overflow:hidden; background:#0A2338; border:4px solid #0A2338; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:linear-gradient(180deg, rgba(10,35,56,.88), rgba(14,60,60,.92)); }
  .hidden{ display:none !important; }
  .eyebrow{ font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--sun); font-weight:800; margin-bottom:6px; }
  #titleArt{ width:190px; image-rendering:auto; margin-bottom:6px; border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,.4); }
  .sub{ font-size:14px; color:var(--foam); opacity:.85; margin-bottom:22px; max-width:280px; }
  button.btn{ font-family:'Baloo 2',sans-serif; font-size:18px; font-weight:700; color:#122B45; background:var(--sun); border:none;
    border-radius:14px; padding:12px 28px; margin:6px; cursor:pointer; box-shadow:0 6px 0 #C98F1E, 0 10px 18px rgba(0,0,0,.35); transition:transform .08s; }
  button.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #C98F1E; }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }
  .roster{ display:flex; gap:8px; margin:14px 0 20px; flex-wrap:wrap; justify-content:center; }
  .card{ width:76px; padding:6px; border-radius:12px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.18);
    cursor:pointer; font-size:11px; text-align:center; }
  .card.picked{ border-color:var(--sun); background:rgba(255,201,74,.22); }
  .card canvas{ width:56px; height:64px; image-rendering:pixelated; }
  .card .name{ font-weight:800; margin-top:2px; }
  .card .stat{ opacity:.75; font-size:9px; }
  #hud{ position:absolute; top:14px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 30px;
    font-family:'Baloo 2',sans-serif; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.5); pointer-events:none; }
  #hud .score{ font-size:44px; font-weight:800; line-height:1; }
  #hud .setInfo{ font-size:12px; opacity:.85; text-align:center; }
  #msg{ position:absolute; top:44%; left:0; right:0; text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:24px;
    text-shadow:0 3px 10px rgba(0,0,0,.6); pointer-events:none; opacity:0; transition:opacity .15s; }
  #msg.show{ opacity:1; }
  #controls-hint{ position:absolute; bottom:100px; left:0; right:0; text-align:center; font-size:10px; opacity:.75; pointer-events:none; }

  #touchpad{ position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 14px; }
  .dpad{ position:relative; width:104px; height:104px; }
  .dbtn{ position:absolute; width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35);
    color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none; touch-action:none; }
  .dbtn:active{ background:rgba(255,201,74,.5); }
  #d-up{ left:34px; top:0; } #d-down{ left:34px; top:68px; } #d-left{ left:0; top:34px; } #d-right{ left:68px; top:34px; }
  .actions{ display:flex; gap:10px; }
  .abtn{ width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14px; color:#122B45; -webkit-user-select:none; user-select:none; touch-action:none; }
  #btn-z{ background:var(--sun); border:2px solid #C98F1E; }
  #btn-x{ background:var(--coral); border:2px solid #B23C2F; color:#fff; }
</style>
</head>

// ---------- Canvas / court geometry ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 400, H = 700;
const COURT = {x:40, y:70, w:320, h:520};
const NET_Y = COURT.y + COURT.h/2;
const HIT_R = 34;

function drawSprite(x,y,scale,charId,poseKey,animT,active){
  const anim = ANIM[poseKey];
  const frames = anim.frames;
  let idx = Math.floor(animT/FRAME_DUR);
  idx = anim.loop ? idx%frames.length : Math.min(idx, frames.length-1);
  const {row,col} = frameRowCol(frames[idx]);
  const img = getSheet(charId, poseKey);
  const dw = CW*scale, dh = CH*scale;
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x, y+dh*0.42, dw*0.55, dh*0.09, 0,0,Math.PI*2);
  ctx.fillStyle='rgba(10,30,40,.28)'; ctx.fill();
  if(active){
    ctx.beginPath();
    ctx.ellipse(x, y+dh*0.42, dw*0.68, dh*0.12, 0,0,Math.PI*2);
    ctx.strokeStyle='#FFC94A'; ctx.lineWidth=2.2; ctx.stroke();
  }
  if(img && img.complete && img.naturalWidth>0){
    ctx.drawImage(img, col*CW, row*CH, CW, CH, x-dw/2, y-dh*0.58, dw, dh);
  }
  ctx.restore();
}
function drawBall(x,y,z,frame){
  const scale = 1 + z/220;
  const srcX = (frame%8)*24;
  ctx.save(); ctx.translate(x, y - z);
  if(ballImg.complete && ballImg.naturalWidth>0){
    ctx.drawImage(ballImg, srcX,0,24,24, -12*scale,-12*scale, 24*scale, 24*scale);
  }
  ctx.restore();
}

// ---------- Game state ----------
let teamA=[], teamB=[];
let players; // 4 Pl objects
let idxA=0, idxB=0; // which teammate is currently "active" (controlled / primary)
let ball;
let state='title';
let score={A:0,B:0};
const MATCH_TARGET=6;
let keys={};
let msgTimer=0;
let ballAnimT=0;
let awaitingServe=false;
const BASE_SPEED=125, MAX_SPEED=560, SPEED_STEP=16;
let pulling=false, dragStart={x:0,y:0}, dragCurrent={x:0,y:0};
const MIN_PULL=14, MAX_PULL_DRAG=150;

function Pl(team, ch, x, y){ return {team, ch, x, y, r:16, pose:'idle', animT:0, lockTimer:0}; }

function layout(){
  const midY = COURT.y + COURT.h*0.72, sideY = COURT.y + COURT.h*0.86;
  const topY = COURT.y + COURT.h*0.24, topSideY = COURT.y + COURT.h*0.10;
  players = [
    Pl('A', teamA[0], COURT.x+COURT.w*0.35, midY),
    Pl('A', teamA[1], COURT.x+COURT.w*0.65, sideY),
    Pl('B', teamB[0], COURT.x+COURT.w*0.35, topY),
    Pl('B', teamB[1], COURT.x+COURT.w*0.65, topSideY),
  ];
  idxA=0; idxB=0;
}
function activeA(){ return players.filter(p=>p.team==='A')[idxA]; }
function activeB(){ return players.filter(p=>p.team==='B')[idxB]; }

function launchBall(towardTeam, fromX){
  // towardTeam: the team that should receive it first (ball heads there)
  ball = {x:fromX!=null?fromX:200, y:NET_Y, z:0, vz:0,
    vx:(Math.random()*2-1)*80,
    vy: towardTeam==='A' ? 140 : -140,
    speed: BASE_SPEED, lastHitTeam: towardTeam==='A' ? 'B':'A',
    touch:0};
  // normalize to BASE_SPEED
  const m = Math.hypot(ball.vx, ball.vy)||1;
  ball.vx = ball.vx/m*BASE_SPEED; ball.vy = ball.vy/m*BASE_SPEED;
}

function resetRally(serveToTeam){
  layout();
  players.forEach(p=>setPose(p,'idle'));
  launchBall(serveToTeam, players.find(p=>p.team!==serveToTeam).x);
  awaitingServe=false;
  const serverTeam = serveToTeam==='A' ? 'B' : 'A';
  const serverPlayer = serverTeam==='A' ? activeA() : activeB();
  setTempPose(serverPlayer, 'serve', ANIM.serve.frames.length*FRAME_DUR);
  showMsg('ラリー開始！ 動いて当てよう', 1100);
}
function showMsg(text, ms){
  const el=document.getElementById('msg');
  el.textContent=text; el.classList.add('show'); msgTimer=ms;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function awardPoint(team){
  if(awaitingServe) return;
  awaitingServe=true;
  score[team]++;
  document.getElementById('scoreA').textContent=score.A;
  document.getElementById('scoreB').textContent=score.B;
  const loser = team==='A' ? 'B' : 'A';
  players.filter(p=>p.team===team).forEach(p=>setTempPose(p,'cheer',1.0));
  players.filter(p=>p.team===loser).forEach(p=>setTempPose(p,'sad',1.0));

  const target = MATCH_TARGET;
  const won = (score.A>=target && score.A-score.B>=2) ? 'A' : (score.B>=target && score.B-score.A>=2) ? 'B' : null;
  if(won){ endMatch(won); return; }
  setTimeout(()=>resetRally(team==='A'?'B':'A'), 700);
}
function endMatch(winner){
  state='end';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls-hint').classList.add('hidden');
  document.getElementById('touchpad').classList.add('hidden');
  document.getElementById('endTitle').textContent = winner==='A'?'WIN!':'LOSE...';
  document.getElementById('endSub').textContent = `${score.A} - ${score.B}`;
  document.getElementById('screen-end').classList.remove('hidden');
}

// ---------- Input ----------
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key]=true;
}, {passive:false});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

function bindHold(el, keyName){
  const on=ev=>{ ev.preventDefault(); keys[keyName]=true; };
  const off=ev=>{ ev.preventDefault(); keys[keyName]=false; };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
bindHold(document.getElementById('d-up'),'ArrowUp');
bindHold(document.getElementById('d-down'),'ArrowDown');
bindHold(document.getElementById('d-left'),'ArrowLeft');
bindHold(document.getElementById('d-right'),'ArrowRight');

let touchDrag = {active:false, lastX:0, lastY:0};
function canvasPointFromEvent(ev){
  const rect = cv.getBoundingClientRect();
  const scaleX = cv.width/rect.width, scaleY = cv.height/rect.height;
  const t = ev.touches && ev.touches.length ? ev.touches[0] : ev;
  return { x: (t.clientX-rect.left)*scaleX, y: (t.clientY-rect.top)*scaleY };
}
cv.addEventListener('touchstart', ev=>{
  ev.preventDefault();
  const p = canvasPointFromEvent(ev);
  touchDrag.active = true; touchDrag.lastX = p.x; touchDrag.lastY = p.y;
}, {passive:false});
cv.addEventListener('touchmove', ev=>{
  if(!touchDrag.active || state!=='play' || !players) return;
  ev.preventDefault();
  const p = canvasPointFromEvent(ev);
  const dx = p.x - touchDrag.lastX, dy = p.y - touchDrag.lastY;
  touchDrag.lastX = p.x; touchDrag.lastY = p.y;
  const a = activeA();
  a.x = clamp(a.x + dx, COURT.x+16, COURT.x+COURT.w-16);
  a.y = clamp(a.y + dy, NET_Y+12, COURT.y+COURT.h-16);
}, {passive:false});
cv.addEventListener('touchend', ()=>{ touchDrag.active=false; }, {passive:false});
cv.addEventListener('touchcancel', ()=>{ touchDrag.active=false; }, {passive:false});

// ---------- Core real-time update ----------
function moveActive(p, dt, spdBase){
  const spd = spdBase*dt;
  if(keys['ArrowLeft']) p.x -= spd;
  if(keys['ArrowRight']) p.x += spd;
  if(keys['ArrowUp']) p.y -= spd*0.7;
  if(keys['ArrowDown']) p.y += spd*0.7;
  p.x = clamp(p.x, COURT.x+16, COURT.x+COURT.w-16);
  p.y = clamp(p.y, NET_Y+12, COURT.y+COURT.h-16);
}
function driftFollow(p, targetX, targetY, dt, spd){
  const dx=targetX-p.x, dy=targetY-p.y, d=Math.hypot(dx,dy);
  if(d>2){ const s=Math.min(spd*dt, d); p.x+=dx/d*s; p.y+=dy/d*s; }
}

function positionSpeedFactor(team, hitter){
  const maxDist = COURT.h/2 - 24; // distance range from net to baseline
  const dist = team==='A' ? (hitter.y-NET_Y) : (NET_Y-hitter.y);
  const t = clamp(dist/maxDist, 0, 1); // 0 = at net, 1 = at baseline
  return 5.0 - t*4.35; // net: 5.0x, baseline: 0.65x
}

function contactHit(team, hitter){
  ball.touch = (ball.touch||0) + 1;
  const finalTouch = ball.touch >= 3;
  const partner = players.filter(p=>p.team===team).find(p=>p!==hitter);

  let speed = Math.min(MAX_SPEED, ball.speed + (finalTouch?SPEED_STEP:6));
  if(finalTouch){
    if(team==='B' && Math.random()<0.55) speed = Math.min(MAX_SPEED, speed*1.3);
    speed = clamp(speed*positionSpeedFactor(team,hitter), BASE_SPEED*0.5, MAX_SPEED);
  } else {
    speed = Math.max(BASE_SPEED*0.55, speed*0.62); // gentler in-team pass
  }

  let dirX, dirY;
  if(finalTouch){
    const dirOut = team==='A' ? -1 : 1;
    const offset = clamp((ball.x - hitter.x)/HIT_R, -1, 1);
    const angle = offset * 0.85;
    dirY = dirOut * Math.cos(angle*0.6);
    dirX = Math.sin(angle) + (Math.random()*0.24-0.12);
  } else {
    const dx = partner.x-ball.x, dy = partner.y-ball.y, d = Math.hypot(dx,dy)||1;
    dirX = dx/d; dirY = dy/d;
  }
  const m = Math.hypot(dirX,dirY)||1;
  ball.vx = dirX/m*speed; ball.vy = dirY/m*speed;
  ball.speed = speed;
  ball.z = Math.max(ball.z, finalTouch?10:6);

  const poseKey = finalTouch ? 'spike' : (ball.touch===1 ? 'receive' : 'toss');
  setTempPose(hitter, poseKey, ANIM[poseKey].frames.length*FRAME_DUR);

  if(finalTouch){
    ball.lastHitTeam = team;
    ball.touch = 0; // fresh count for whichever team receives next
  }
  if(team==='A'){ idxA = 1-idxA; } else { idxB = 1-idxB; }
}

function update(dt){
  if(msgTimer>0){ msgTimer-=dt*1000; if(msgTimer<=0) document.getElementById('msg').classList.remove('show'); }
  ballAnimT += dt;
  if(state!=='play') return;

  players.forEach(p=>{
    p.animT += dt;
    if(p.lockTimer>0){ p.lockTimer-=dt; if(p.lockTimer<=0){ p.lockTimer=0; setPose(p,'idle'); } }
  });

  if(awaitingServe) return;

  const aAct = activeA(), aOther = players.filter(p=>p.team==='A').find(p=>p!==aAct);
  const bAct = activeB(), bOther = players.filter(p=>p.team==='B').find(p=>p!==bAct);

  if(aAct.lockTimer<=0) setPose(aAct,'idle');
  if(aOther.lockTimer<=0) setPose(aOther,'idle');
  if(bAct.lockTimer<=0) setPose(bAct,'idle');
  if(bOther.lockTimer<=0) setPose(bOther,'idle');

  moveActive(aAct, dt, 210*aAct.ch.speed);
  driftFollow(aOther, COURT.x+COURT.w*0.5 + (aAct.x < COURT.x+COURT.w*0.5 ? COURT.w*0.22 : -COURT.w*0.22), COURT.y+COURT.h*0.82, dt, 90);

  // CPU movement: track ball when on their side, else return to guard position
  if(ball.y < NET_Y){
    driftFollow(bAct, clamp(ball.x, COURT.x+18, COURT.x+COURT.w-18), clamp(ball.y+6, COURT.y+8, NET_Y-10), dt, 280*bAct.ch.speed);
  } else {
    driftFollow(bAct, COURT.x+COURT.w*0.5, COURT.y+COURT.h*0.22, dt, 160);
  }
  driftFollow(bOther, COURT.x+COURT.w*0.5 + (bAct.x < COURT.x+COURT.w*0.5 ? COURT.w*0.22 : -COURT.w*0.22), COURT.y+COURT.h*0.10, dt, 140);

  // hard safety clamp: nobody may ever cross to the other side of the net
  players.forEach(p=>{
    p.x = clamp(p.x, COURT.x+16, COURT.x+COURT.w-16);
    if(p.team==='A'){ p.y = clamp(p.y, NET_Y+10, COURT.y+COURT.h-16); }
    else { p.y = clamp(p.y, COURT.y+8, NET_Y-10); }
  });

  ball.x += ball.vx*dt; ball.y += ball.vy*dt;
  ball.z += ball.vz*dt; ball.vz -= 260*dt;
  if(ball.z<0){ ball.z=0; ball.vz=0; }

  // side wall bounce
  if(ball.x < COURT.x+10){ ball.x=COURT.x+10; ball.vx=Math.abs(ball.vx); }
  if(ball.x > COURT.x+COURT.w-10){ ball.x=COURT.x+COURT.w-10; ball.vx=-Math.abs(ball.vx); }

  // hit checks — every contact (receive / toss / attack) goes through contactHit;
  // it figures out which of the 3 touches this is and reflects accordingly.
  if(ball.y > NET_Y && ball.lastHitTeam!=='A'){
    const d = Math.hypot(ball.x-aAct.x, ball.y-aAct.y);
    if(d < HIT_R){ contactHit('A', aAct); }
  }
  if(ball.y < NET_Y && ball.lastHitTeam!=='B'){
    const d = Math.hypot(ball.x-bAct.x, ball.y-bAct.y);
    if(d < HIT_R){ contactHit('B', bAct); }
  }

  // scoring: passed baseline without being hit
  if(ball.y > COURT.y+COURT.h+14){ awardPoint('B'); return; }
  if(ball.y < COURT.y-14){ awardPoint('A'); return; }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(state!=='play') return;

  // clean gradient beach backdrop (no mismatched reference lines)
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#6FD3E8'); bg.addColorStop(0.42,'#9FE3D7');
  bg.addColorStop(0.44,'#F4D58D'); bg.addColorStop(1,'#E8C070');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(241,210,142,.96)'; ctx.fillRect(COURT.x,COURT.y,COURT.w,COURT.h);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(COURT.x,COURT.y,COURT.w,COURT.h);
  ctx.beginPath(); ctx.moveTo(COURT.x,NET_Y); ctx.lineTo(COURT.x+COURT.w,NET_Y);
  ctx.strokeStyle='#0E7C86'; ctx.lineWidth=5; ctx.stroke();
  ctx.fillStyle='#0E7C86'; ctx.fillRect(COURT.x-6,NET_Y-4,6,8); ctx.fillRect(COURT.x+COURT.w,NET_Y-4,6,8);

  const sorted=[...players].sort((a,b)=>a.y-b.y);
  sorted.forEach(p=>{
    const isActive = (p.team==='A' && p===activeA()) || (p.team==='B' && p===activeB());
    drawSprite(p.x,p.y,0.85,p.ch.id,p.pose,p.animT,isActive);
  });
  const frame=Math.floor(ballAnimT*10);
  drawBall(ball.x, ball.y, ball.z||0, frame);
}

let last=performance.now();
function tick(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  update(dt); render();
  requestAnimationFrame(tick);
}

// ---------- Screen flow ----------
function startMatch(){
  document.getElementById('screen-title').classList.add('hidden');
  const shuffledP=[...ROSTER].sort(()=>Math.random()-0.5);
  teamA = shuffledP.slice(0,2);
  const shuffledE=[...CPU_ROSTER].sort(()=>Math.random()-0.5);
  teamB = shuffledE.slice(0,2);
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('controls-hint').classList.remove('hidden');
  document.getElementById('touchpad').classList.remove('hidden');
  score={A:0,B:0};
  document.getElementById('scoreA').textContent=0;
  document.getElementById('scoreB').textContent=0;
  document.getElementById('setInfo').textContent=`6点先取`;
  state='play';
  resetRally('A');
}
document.getElementById('toSelect').addEventListener('click', startMatch);
document.getElementById('restart').addEventListener('click', ()=>{
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-title').classList.remove('hidden');
  state='title';
});

requestAnimationFrame(tick);
})();
</script>
