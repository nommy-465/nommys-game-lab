
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
#wrap{position:relative;width:100%;max-width:390px;margin:0 auto;background:#050510;border-radius:18px;overflow:hidden;box-shadow:0 0 60px rgba(30,80,255,0.2);display:flex;flex-direction:column;}
#gameArea{position:relative;width:100%;aspect-ratio:9/13;flex-shrink:0;}
#c{display:block;width:100%;height:100%;touch-action:none;}
#hud{position:absolute;inset:0;pointer-events:none;}
#scoreEl{position:absolute;top:14px;left:16px;color:#fff;font-size:14px;font-weight:700;font-family:monospace;text-shadow:0 0 10px rgba(80,180,255,0.9),0 1px 3px #000;}
#livesEl{position:absolute;top:14px;right:16px;color:#ffd700;font-size:14px;font-weight:700;font-family:monospace;text-shadow:0 0 10px rgba(255,200,0,0.9),0 1px 3px #000;}
#overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;font-weight:600;text-align:center;font-family:monospace;background:rgba(4,4,28,0.88);padding:18px 26px;border-radius:14px;border:1px solid rgba(80,140,255,0.4);line-height:2.1;pointer-events:auto;backdrop-filter:blur(6px);white-space:nowrap;}

#controls{flex-shrink:0;width:100%;background:linear-gradient(180deg,#080818 0%,#040410 100%);border-top:1px solid rgba(60,100,255,0.18);padding:10px 16px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){ try {

var canvas=document.getElementById('c');
var scoreEl=document.getElementById('scoreEl');
var livesEl=document.getElementById('livesEl');
var overlay=document.getElementById('overlay');
var popupEl=document.getElementById('popup');

var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setClearColor(0x05050f,1);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
var scene=new THREE.Scene();
// ★ FOVを広げて球体が大きく見えるように
var camera=new THREE.PerspectiveCamera(72,1,0.1,500);

function resize(){
  var w=canvas.clientWidth,h=canvas.clientHeight;
  if(!h||h<10)h=Math.round(w*13/9);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
resize();
try{var ro=new ResizeObserver(function(){setTimeout(resize,30);});ro.observe(canvas);}catch(e){window.addEventListener('resize',function(){setTimeout(resize,50);});}

var sv=[];for(var i=0;i<1400;i++)sv.push((Math.random()-.5)*320,(Math.random()-.5)*320,(Math.random()-.5)*320);
var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.38})));

scene.add(new THREE.AmbientLight(0x334466,1.1));
var sl=new THREE.DirectionalLight(0xaaccff,1.4);sl.position.set(50,70,30);scene.add(sl);
var fl=new THREE.PointLight(0x2255ff,0.6,220);fl.position.set(-40,20,-40);scene.add(fl);

var PLANET_R=14;
var pGeo=new THREE.IcosahedronGeometry(PLANET_R,3);
var pa=pGeo.attributes.position;
for(var i=0;i<pa.count;i++){
  var vx=pa.getX(i),vy=pa.getY(i),vz=pa.getZ(i),rr=Math.sqrt(vx*vx+vy*vy+vz*vz);
  var nx=vx/rr,ny=vy/rr,nz=vz/rr;
  var dd=Math.sin(nx*7)*Math.cos(ny*5)*Math.sin(nz*6)*1.2+Math.cos(nx*3)*Math.sin(ny*11)*Math.cos(nz*4)*0.6;
  pa.setXYZ(i,vx+nx*dd,vy+ny*dd,vz+nz*dd);
}
pa.needsUpdate=true;pGeo.computeVertexNormals();
var planetMesh=new THREE.Mesh(pGeo,new THREE.MeshPhongMaterial({color:0x1a4a8f,emissive:0x061022,specular:0x4488ff,shininess:30,flatShading:true}));
scene.add(planetMesh);
scene.add(new THREE.Mesh(pGeo.clone(),new THREE.MeshBasicMaterial({color:0x3a7fff,wireframe:true,transparent:true,opacity:0.16})));

function getSurface(dir){
  var hits=new THREE.Raycaster(dir.clone().multiplyScalar(30),dir.clone().negate()).intersectObject(planetMesh);
  return hits.length>0?hits[0].point.clone():dir.clone().multiplyScalar(PLANET_R);
}

function buildAlien(){
  var root=new THREE.Group();
  var mB=new THREE.MeshPhongMaterial({color:0xff2222,emissive:0x440000,flatShading:true});
  var mC=new THREE.MeshPhongMaterial({color:0xff4444,emissive:0x330000,flatShading:true});
  var mS=new THREE.MeshPhongMaterial({color:0xffaaaa,emissive:0x220000,flatShading:true});
  var mE=new THREE.MeshPhongMaterial({color:0x00ffcc,emissive:0x004422,flatShading:true});
  var mP=new THREE.MeshBasicMaterial({color:0x001100});
  function pt(geo,mat,x,y,z){var m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);root.add(m);return m;}
  pt(new THREE.CylinderGeometry(0.18,0.22,0.55,7),mB,0,0.28,0);
  pt(new THREE.CylinderGeometry(0.26,0.20,0.18,7),mB,0,0,0);
  var cap=new THREE.Mesh(new THREE.SphereGeometry(0.55,8,6,0,Math.PI*2,0,Math.PI*0.6),mC);cap.position.y=0.52;root.add(cap);
  var cb=new THREE.Mesh(new THREE.CircleGeometry(0.53,8),mB);cb.rotation.x=Math.PI/2;cb.position.y=0.52;root.add(cb);
  var spd=[{x:0.18,z:0.15},{x:-0.2,z:0.1},{x:0.05,z:-0.22},{x:-0.1,z:-0.18},{x:0.22,z:-0.08}];
  for(var si=0;si<spd.length;si++){var sx=spd[si].x,sz=spd[si].z,sy=Math.sqrt(Math.max(0,0.3025-sx*sx-sz*sz));var sm=new THREE.Mesh(new THREE.SphereGeometry(0.07,5,4),mS);sm.position.set(sx,0.52+sy*0.85,sz);root.add(sm);}
  pt(new THREE.SphereGeometry(0.09,6,5),mE,-0.13,0.48,0.43);pt(new THREE.SphereGeometry(0.09,6,5),mE,0.13,0.48,0.43);
  pt(new THREE.SphereGeometry(0.05,5,4),mP,-0.13,0.48,0.50);pt(new THREE.SphereGeometry(0.05,5,4),mP,0.13,0.48,0.50);
  var tL=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.03,0.35,5),mB);tL.position.set(-0.28,0.88,0.1);tL.rotation.z=0.5;root.add(tL);
  var tR=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.03,0.35,5),mB);tR.position.set(0.28,0.88,0.1);tR.rotation.z=-0.5;root.add(tR);
  pt(new THREE.SphereGeometry(0.06,5,4),mS,-0.44,0.97,0.1);pt(new THREE.SphereGeometry(0.06,5,4),mS,0.44,0.97,0.1);
  root._mB=mB;root._mC=mC;return root;
}

function buildAstronaut(){
  var root=new THREE.Group();
  var mW=new THREE.MeshPhongMaterial({color:0xdddddd,flatShading:true,transparent:true,opacity:1});
  var mO=new THREE.MeshPhongMaterial({color:0xff6600,flatShading:true,transparent:true,opacity:1});
  var mG=new THREE.MeshPhongMaterial({color:0x888888,flatShading:true,transparent:true,opacity:1});
  var mV=new THREE.MeshPhongMaterial({color:0x1a3a5c,specular:0x88ccff,shininess:60,transparent:true,opacity:1});
  var mGd=new THREE.MeshPhongMaterial({color:0xddaa00,flatShading:true,transparent:true,opacity:1});
  root._mats=[mW,mO,mG,mV,mGd];
  function pt(geo,mat,x,y,z){var m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);root.add(m);return m;}
  pt(new THREE.BoxGeometry(0.68,0.70,0.46),mW,0,0.52,0);
  pt(new THREE.BoxGeometry(0.34,0.46,0.18),mG,0,0.56,-0.33);
  pt(new THREE.BoxGeometry(0.26,0.07,0.48),mO,0,0.58,0);
  pt(new THREE.BoxGeometry(0.10,0.07,0.48),mO,-0.35,0.68,0);pt(new THREE.BoxGeometry(0.10,0.07,0.48),mO,0.35,0.68,0);
  pt(new THREE.SphereGeometry(0.34,7,5),mW,0,1.08,0);
  var vm=new THREE.Mesh(new THREE.SphereGeometry(0.25,7,5),mV);vm.position.set(0.05,1.08,0.20);root.add(vm);
  var ring=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.035,6,10),mG);ring.rotation.x=Math.PI/2;ring.position.set(0,1.08,0);root.add(ring);
  pt(new THREE.CylinderGeometry(0.02,0.02,0.20,4),mG,0.26,1.36,0);pt(new THREE.SphereGeometry(0.04,4,3),mGd,0.26,1.48,0);
  var aL=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.10,0.50,5),mW);aL.position.set(-0.44,0.48,0);aL.rotation.z=0.30;root.add(aL);
  var aR=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.10,0.50,5),mW);aR.position.set(0.44,0.48,0);aR.rotation.z=-0.30;root.add(aR);
  pt(new THREE.SphereGeometry(0.11,5,4),mO,-0.60,0.26,0);pt(new THREE.SphereGeometry(0.11,5,4),mO,0.60,0.26,0);
  pt(new THREE.BoxGeometry(0.08,0.08,0.28),mG,0.60,0.26,0.16);
  var bar=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.16,5),mGd);bar.rotation.x=Math.PI/2;bar.position.set(0.60,0.26,0.31);root.add(bar);
  var lL=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.12,0.46,5),mW);lL.position.set(-0.18,0.02,0);root.add(lL);
  var lR=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.12,0.46,5),mW);lR.position.set(0.18,0.02,0);root.add(lR);
  pt(new THREE.BoxGeometry(0.18,0.10,0.28),mO,-0.18,-0.21,0.05);pt(new THREE.BoxGeometry(0.18,0.10,0.28),mO,0.18,-0.21,0.05);
  root.scale.setScalar(0.75);root._lL=lL;root._lR=lR;return root;
}

var playerGroup=new THREE.Group();var astro=buildAstronaut();playerGroup.add(astro);scene.add(playerGroup);
var walkT=0;

var coinMeshes=[];
for(var i=0;i<10;i++){var cm=new THREE.Mesh(new THREE.OctahedronGeometry(0.4,0),new THREE.MeshPhongMaterial({color:0xffd700,emissive:0x332200,flatShading:true}));scene.add(cm);coinMeshes.push(cm);}

var EP=18,enemyPool=[];
for(var i=0;i<EP;i++){var al=buildAlien();al.visible=false;scene.add(al);enemyPool.push({g:al,on:false,dir:new THREE.Vector3(0,0,1),ax:new THREE.Vector3(0,1,0),tv:0.012,mv:true,st:60,sc:1,tsc:1,gs:0,sp:false,jt:0,bt:Math.random()*Math.PI*2});}

var LR=PLANET_R+1.2,LTOT=Math.PI*3,LSPD=0.01875,LTRAIL=22;
var lasers=[];
for(var i=0;i<6;i++){var dd=[];for(var j=0;j<LTRAIL;j++){var ld=new THREE.Mesh(new THREE.SphereGeometry(0.07+0.05*(1-j/LTRAIL),4,3),new THREE.MeshBasicMaterial({color:0xff3333}));ld.visible=false;scene.add(ld);dd.push(ld);}lasers.push({on:false,angle:0,orig:new THREE.Vector3(),tang:new THREE.Vector3(),dots:dd,trail:[]});}
function gcPos(o,t,a,r){return o.clone().multiplyScalar(Math.cos(a)).addScaledVector(t,Math.sin(a)).normalize().multiplyScalar(r);}

var PM=300,pts=[];
for(var i=0;i<PM;i++)pts.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,li:0,ml:1,r:1,g:0,b:0,sz:0.5});
var pp=new Float32Array(PM*3),pc=new Float32Array(PM*3),ps=new Float32Array(PM);
var ptGeo=new THREE.BufferGeometry();
ptGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));ptGeo.setAttribute('color',new THREE.BufferAttribute(pc,3));ptGeo.setAttribute('size',new THREE.BufferAttribute(ps,1));
scene.add(new THREE.Points(ptGeo,new THREE.PointsMaterial({size:0.55,vertexColors:true,transparent:true,sizeAttenuation:true,depthWrite:false})));

function boomP(pos){var n=0;for(var i=0;i<PM&&n<20;i++){var p=pts[i];if(p.on)continue;p.on=true;p.x=pos.x;p.y=pos.y;p.z=pos.z;var th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),s=0.22*(0.4+Math.random()*0.8);p.vx=Math.sin(ph)*Math.cos(th)*s;p.vy=Math.sin(ph)*Math.sin(th)*s;p.vz=Math.cos(ph)*s;p.ml=16+(Math.random()*16|0);p.li=0;var col=new THREE.Color().setHSL(0.04,1,.6+Math.random()*.3);p.r=col.r;p.g=col.g;p.b=col.b;p.sz=.4+Math.random()*.4;n++;}boomGlow.position.copy(pos);boomGlow.intensity=3;boomGlow.color.setHex(0xff4400);}
function tickP(){for(var i=0;i<PM;i++){var p=pts[i];if(!p.on){pp[i*3]=9999;pp[i*3+1]=9999;pp[i*3+2]=9999;ps[i]=0;continue;}p.li++;var t=p.li/p.ml;if(t>=1){p.on=false;ps[i]=0;continue;}p.vx*=.87;p.vy*=.87;p.vz*=.87;p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;pp[i*3]=p.x;pp[i*3+1]=p.y;pp[i*3+2]=p.z;var a=1-t;pc[i*3]=p.r*a;pc[i*3+1]=p.g*a;pc[i*3+2]=p.b*a;ps[i]=p.sz*(1-t*.7);}ptGeo.attributes.position.needsUpdate=true;ptGeo.attributes.color.needsUpdate=true;ptGeo.attributes.size.needsUpdate=true;if(boomGlow.intensity>0)boomGlow.intensity*=.84;if(laserGlow.intensity>0)laserGlow.intensity*=.80;}

var popT=0,popD=70;
function showPop(wp,txt,col){popupEl.textContent=txt;popupEl.style.color=col||'#ffd700';popupEl.style.display='block';popupEl.style.opacity='1';popupEl._wp=wp.clone();popT=popD;}
function tickPop(){if(popT<=0){popupEl.style.display='none';return;}popT--;var t=popT/popD;popupEl.style.opacity=(t<0.3?t/0.3:1).toString();if(popupEl._wp){var p=popupEl._wp.clone(),u=p.clone().normalize();p.addScaledVector(u,4.5);p.project(camera);var w=canvas.clientWidth,h=canvas.clientHeight;popupEl.style.left=((p.x+1)/2*w-70)+'px';popupEl.style.top=((-p.y+1)/2*h-18)+'px';}}

var RS=Math.PI/8,MD=0.028,CAD=0.165,CAS=0.018,ES=0.012,GD=300,CD=0.85;
var score,lives,over,started,frame,fc,dead,rotC,pPos,pFwd,coins;

// ★ カメラを高く遠く配置：up方向18 + back方向8
var CAM_UP=18, CAM_BACK=8;
var camP=new THREE.Vector3(0,1,0).multiplyScalar(PLANET_R+CAM_UP);
var camF=new THREE.Vector3(1,0,0);
var rev=false,deathAnim=false,deathT=0,DDUR=90;
var keys={};

function setKey(c,v){keys[c]=v;if(v&&!started&&!over){started=true;overlay.style.display='none';}}
function bindBtn(id,code){
  var el=document.getElementById(id);if(!el)return;
  el.addEventListener('pointerdown',function(e){e.preventDefault();setKey(code,true);},{passive:false});
  el.addEventListener('pointerup',function(e){e.preventDefault();setKey(code,false);},{passive:false});
  el.addEventListener('pointercancel',function(){setKey(code,false);});
  el.addEventListener('pointerleave',function(){setKey(code,false);});
}
bindBtn('bU','ArrowUp');bindBtn('bD','ArrowDown');bindBtn('bL','ArrowLeft');bindBtn('bR','ArrowRight');
var fb=document.getElementById('bFire');
fb.addEventListener('pointerdown',function(e){e.preventDefault();setKey('Space',true);},{passive:false});
fb.addEventListener('pointerup',function(e){e.preventDefault();setKey('Space',false);},{passive:false});
fb.addEventListener('pointercancel',function(){setKey('Space',false);});
fb.addEventListener('pointerleave',function(){setKey('Space',false);});
document.addEventListener('keydown',function(e){setKey(e.code,true);});
document.addEventListener('keyup',function(e){keys[e.code]=false;});
canvas.addEventListener('pointerdown',function(){if(!started&&!over){started=true;overlay.style.display='none';}},{passive:true});

function rotF(pos,fwd,a){var q=new THREE.Quaternion().setFromAxisAngle(pos,a);fwd.applyQuaternion(q);fwd.addScaledVector(pos,-fwd.dot(pos)).normalize();}
function stepMove(pos,fwd,d){var cD=Math.cos(d),sD=Math.sin(d);var nP=pos.clone().multiplyScalar(cD).addScaledVector(fwd,sD).normalize();var nF=pos.clone().multiplyScalar(-sD).addScaledVector(fwd,cD).normalize();pos.copy(nP);fwd.copy(nF);fwd.addScaledVector(pos,-fwd.dot(pos)).normalize();}
function tpd(th,ph){return new THREE.Vector3(Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)).normalize();}
function mTow(dir,tgt,sp){var t=tgt.clone().addScaledVector(dir,-tgt.dot(dir));if(t.length()<0.0001)return;t.normalize();dir.copy(dir.clone().multiplyScalar(Math.cos(sp)).addScaledVector(t,Math.sin(sp)).normalize());}
function iE(e,dir,isSp){var r2=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();e.dir=dir.clone();e.ax=dir.clone().cross(r2).normalize();e.tv=ES*(0.6+Math.random()*0.8)*(Math.random()<0.5?1:-1);e.mv=true;e.st=60+Math.floor(Math.random()*120);e.sp=isSp;e.jt=0;e.bt=Math.random()*Math.PI*2;if(isSp){e.sc=0.35;e.tsc=1.0;e.gs=0.65/GD;}else{e.sc=1.0;e.tsc=1.0;e.gs=0;}e.on=true;e.g.visible=true;e.g._mB.color.setHex(isSp?0xff5555:0xff2222);e.g._mC.color.setHex(isSp?0xff7777:0xff4444);}
function spawnE(){for(var i=0;i<EP;i++){if(!enemyPool[i].on){var r=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();var cr=pPos.clone().cross(r).normalize();var q2=new THREE.Quaternion().setFromAxisAngle(cr,Math.PI*.5+Math.random()*Math.PI*.5);iE(enemyPool[i],pPos.clone().applyQuaternion(q2).normalize(),false);return;}}}
function splitE(e){var cnt=0;for(var i=0;i<EP&&cnt<2;i++){if(!enemyPool[i].on){var pr=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5);pr.addScaledVector(e.dir,-pr.dot(e.dir)).normalize();iE(enemyPool[i],e.dir.clone().addScaledVector(pr,cnt===0?0.08:-0.08).normalize(),true);cnt++;}}}

function showGO(){over=true;overlay.innerHTML='GAME OVER<br><span style="font-size:20px;color:#ffd700;font-weight:700;">'+score+' pt</span><br><button id="rb" style="margin-top:14px;padding:12px 34px;font-size:15px;font-family:monospace;background:rgba(60,140,255,.25);color:#fff;border:1.5px solid rgba(100,180,255,.5);border-radius:10px;cursor:pointer;">▶ リトライ</button>';overlay.style.display='block';overlay.style.pointerEvents='auto';document.getElementById('rb').addEventListener('pointerdown',function(e){e.preventDefault();initGame();started=true;overlay.style.display='none';},{passive:false});}
function killPl(){if(dead)return;dead=true;deathAnim=true;deathT=0;for(var i=0;i<EP;i++){if(enemyPool[i].on)enemyPool[i].jt=200;}}
function fireL(){var l=null;for(var i=0;i<lasers.length;i++){if(!lasers[i].on){l=lasers[i];break;}}if(!l)return;var s=getSurface(pPos);l.orig.copy(s.clone().normalize());l.tang.copy(pFwd.clone());l.tang.addScaledVector(l.orig,-l.tang.dot(l.orig)).normalize();l.angle=0;l.on=true;l.trail=[];laserGlow.intensity=4;laserGlow.position.copy(gcPos(l.orig,l.tang,0,LR));}
function colCoin(c){c.on=false;c.m.visible=false;score+=10;scoreEl.textContent='SCORE: '+score;showPop(playerGroup.position,'+10 → '+score+'pt','#ffd700');(function(r){setTimeout(function(){r.dir=tpd(Math.random()*Math.PI*2,Math.random()*Math.PI*.6+Math.PI*.2);r.on=true;r.m.visible=true;},1500);})(c);}

function initGame(){
  score=0;lives=3;over=false;started=false;frame=0;fc=0;dead=false;deathAnim=false;deathT=0;walkT=0;rotC=0;popT=0;rev=false;keys={};
  scoreEl.textContent='SCORE: 0';livesEl.textContent='♦ ♦ ♦';popupEl.style.display='none';
  pPos=new THREE.Vector3(0,0,1);pFwd=new THREE.Vector3(1,0,0);
  playerGroup.visible=true;
  if(astro._mats)astro._mats.forEach(function(m){m.opacity=1;});
  astro.rotation.y=0;
  coins=coinMeshes.map(function(m){return{m:m,dir:tpd(Math.random()*Math.PI*2,Math.random()*Math.PI*.6+Math.PI*.2),on:true,bob:Math.random()*Math.PI*2};});
  coinMeshes.forEach(function(m){m.visible=true;});
  for(var i=0;i<EP;i++){enemyPool[i].on=false;enemyPool[i].g.visible=false;enemyPool[i].g.scale.setScalar(1);enemyPool[i].jt=0;}
  lasers.forEach(function(l){l.on=false;l.trail=[];l.dots.forEach(function(d){d.visible=false;});});
  pts.forEach(function(p){p.on=false;});
  camF.copy(pFwd);
  overlay.innerHTML='↑前進 ↓後退 ←→回転<br>FIREでレーザー発射<br><span style="font-size:11px;color:#88aaff;font-weight:400;">Tap to start</span>';
  overlay.style.display='block';overlay.style.pointerEvents='none';
}
initGame();

function updEn(){
  for(var i=0;i<EP;i++){
    var e=enemyPool[i];if(!e.on)continue;
    e.bt+=0.06;
    if(e.jt>0){e.jt--;var js=e.sc*(1+Math.sin(e.jt*0.35)*0.35);e.g.scale.set(js,js*(1+Math.sin(e.bt*2)*0.18),js);}
    else{
      if(e.sc<e.tsc)e.sc=Math.min(e.tsc,e.sc+e.gs);
      e.g.scale.set(e.sc,e.sc*(1+Math.sin(e.bt)*0.10),e.sc);
      e.st--;
      if(e.st<=0){e.mv=!e.mv;if(e.mv){var r4=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();e.ax=e.dir.clone().cross(r4).normalize();e.tv=ES*(0.5+Math.random())*(Math.random()<.5?1:-1);e.st=60+Math.floor(Math.random()*120);}else e.st=30+Math.floor(Math.random()*90);}
      if(e.mv){var q3=new THREE.Quaternion().setFromAxisAngle(e.ax,e.tv);e.dir.applyQuaternion(q3).normalize();}
    }
    var es=getSurface(e.dir),eu=es.clone().normalize();
    e.g.position.copy(es.clone().addScaledVector(eu,0.9*e.sc));
    var qe=new THREE.Quaternion();qe.setFromUnitVectors(new THREE.Vector3(0,1,0),eu);e.g.quaternion.copy(qe);
    if(e.mv)e.g.rotateY(0.04);
    if(!dead&&playerGroup.position.distanceTo(e.g.position)<CD*e.sc){killPl();e.jt=200;}
  }
}

function update(){
  if(!started||over)return;
  frame++;tickP();tickPop();

  if(deathAnim){
    deathT++;astro.rotation.y+=0.25;
    var dt=deathT/DDUR,op=dt<0.4?1:Math.max(0,1-(dt-0.4)/0.6);
    if(astro._mats)astro._mats.forEach(function(m){m.opacity=op;});
    if(deathT>=DDUR){playerGroup.visible=false;deathAnim=false;setTimeout(showGO,400);}
    camera.position.copy(camP);
    var u0=playerGroup.position.clone().normalize();
    camera.up.copy(u0);
    camera.lookAt(playerGroup.position.clone().addScaledVector(u0,-4));
    updEn();return;
  }
  if(dead)return;

  if(rotC>0)rotC--;
  if(keys['ArrowLeft']&&rotC===0){rotF(pPos,pFwd,RS);rotC=8;}
  if(keys['ArrowRight']&&rotC===0){rotF(pPos,pFwd,-RS);rotC=8;}
  var fw=!!keys['ArrowUp'],bk=!!keys['ArrowDown'];
  rev=bk&&!fw;
  if(fw)stepMove(pPos,pFwd,MD);else if(bk)stepMove(pPos,pFwd,-MD);

  var surf=getSurface(pPos),up=surf.clone().normalize();
  playerGroup.position.copy(surf.clone().addScaledVector(up,1.0));
  var q=new THREE.Quaternion();q.setFromUnitVectors(new THREE.Vector3(0,1,0),up);playerGroup.quaternion.copy(q);
  var iQ=playerGroup.quaternion.clone().invert();
  var lf=pFwd.clone().applyQuaternion(iQ);
  astro.rotation.y=Math.atan2(lf.x,lf.z);
  var mv=fw||bk;if(mv)walkT+=0.15;
  if(astro._lL)astro._lL.rotation.x=mv?Math.sin(walkT)*0.32:0;
  if(astro._lR)astro._lR.rotation.x=mv?-Math.sin(walkT)*0.32:0;

  if(fc>0)fc--;
  if(keys['Space']&&fc===0){fireL();fc=18;}

  for(var li=0;li<lasers.length;li++){
    var l=lasers[li];if(!l.on)continue;
    l.angle+=LSPD;l.trail.unshift(l.angle);if(l.trail.length>LTRAIL)l.trail.length=LTRAIL;
    if(l.angle>=LTOT){l.on=false;l.dots.forEach(function(d){d.visible=false;});continue;}
    var hp=gcPos(l.orig,l.tang,l.angle,LR);laserGlow.position.copy(hp);
    for(var j=0;j<LTRAIL;j++){var dot=l.dots[j];if(j<l.trail.length){dot.position.copy(gcPos(l.orig,l.tang,l.trail[j],LR));var aa=1-j/LTRAIL;dot.material.color.setHSL(0,1,0.4+0.5*aa);dot.scale.setScalar(aa*1.1+0.1);dot.visible=true;}else dot.visible=false;}
    var hE=false;
    for(var ei=0;ei<EP&&!hE;ei++){
      var e=enemyPool[ei];if(!e.on)continue;
      if(hp.distanceTo(e.g.position)<1.0*e.sc){
        boomP(e.g.position.clone());var hp2=e.g.position.clone(),wasSp=e.sp;
        e.on=false;e.g.visible=false;e.g.scale.setScalar(1);l.on=false;l.dots.forEach(function(d){d.visible=false;});hE=true;
        if(!wasSp){score+=25;scoreEl.textContent='SCORE: '+score;showPop(hp2,'+25 → '+score+'pt','#ff8844');splitE(e);}
        else{score+=50;scoreEl.textContent='SCORE: '+score;showPop(hp2,'+50 → '+score+'pt','#ffcc44');}
      }
    }
    if(hE)continue;
    if(l.on&&l.angle>Math.PI*1.1&&hp.distanceTo(playerGroup.position)<1.5){l.on=false;l.dots.forEach(function(d){d.visible=false;});killPl();}
  }

  for(var ci=0;ci<coins.length;ci++){
    var c=coins[ci];if(!c.on)continue;
    c.bob+=0.05;var d2=pPos.distanceTo(c.dir),att=d2<CAD;
    if(att)mTow(c.dir,pPos,CAS);
    var cs=getSurface(c.dir),cu=cs.clone().normalize();
    c.m.position.copy(cs.clone().addScaledVector(cu,att?1.5:1.2+Math.sin(c.bob)*.14));
    c.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),cu);c.m.rotateY(att?0.12:0.04);
    if(pPos.distanceTo(c.dir)<0.10)colCoin(c);
  }

  if(frame%140===0)spawnE();
  updEn();

  // ★ カメラ: up方向18 + back方向8 → 球体の大部分が見える
  camF.lerp(pFwd,rev?0:0.07).normalize();
  var camBack=camF.clone().negate();
  var desiredCam=playerGroup.position.clone()
    .addScaledVector(up, CAM_UP)
    .addScaledVector(camBack, CAM_BACK);
  camP.lerp(desiredCam, rev?0:0.06);
  camera.position.copy(camP);
  camera.up.copy(up);
  // ★ 注視点: プレイヤーより少し惑星中心寄りを見る → 球体が画面に収まる
  camera.lookAt(playerGroup.position.clone().addScaledVector(up,-4));
}

function loop(){update();renderer.render(scene,camera);requestAnimationFrame(loop);}
loop();

}catch(err){
  document.getElementById('overlay').innerHTML='Error: '+err.message+'<br><small>'+(err.stack||'').substring(0,120)+'</small>';
  document.getElementById('overlay').style.display='block';
  document.getElementById('overlay').style.pointerEvents='auto';
}})();
</script>
